<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f5f3" />
    <meta name="description" content="未名生物收容所：只有一双眼睛的纯白软团子，自动、轻柔地呼吸和摇晃。" />
    <title>未名生物收容所 · 初生</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./style.css" />
    <script src="./creature.js" defer></script>
  </head>
  <body>
    <main>
      <svg class="scene" viewBox="0 80 640 480" role="img" aria-label="可按住轮廓拖动塑形的纯白软团子，持续浮动、摇晃和眨眼">
        <defs>
          <radialGradient id="floor-softness">
            <stop offset="0" stop-color="#aaa6a0" stop-opacity=".21" />
            <stop offset=".5" stop-color="#b5b0a9" stop-opacity=".10" />
            <stop offset="1" stop-color="#b5b0a9" stop-opacity="0" />
          </radialGradient>
          <filter id="soft-edge" x="-25%" y="-25%" width="150%" height="160%" color-interpolation-filters="sRGB">
            <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#918a82" flood-opacity=".09" />
          </filter>
        </defs>
        <ellipse id="floor" cx="320" cy="437" rx="111" ry="13" fill="url(#floor-softness)" />
        <g id="creature" transform="translate(320 428)">
          <g id="skin" fill="#ffffff" filter="url(#soft-edge)">
            <path id="body" fill="#ffffff" />
            <g id="limbs" fill="#ffffff"></g>
          </g>
          <g id="eyes" fill="#292940">
            <ellipse id="eye-left" cx="-29" cy="-120" rx="10.2" ry="15.5" />
            <ellipse id="eye-right" cx="29" cy="-120" rx="10.2" ry="15.5" />
          </g>
          <g id="limb-controls" aria-label="肢体调整控制点"></g>
        </g>
      </svg>
      <div class="tools" role="group" aria-label="塑形操作">
        <button id="body-mode" type="button" aria-pressed="true">揉捏身体</button>
        <button id="limb-mode" type="button" aria-pressed="false">长出肢体</button>
        <button id="paint-mode" type="button" aria-pressed="false">自由涂色</button>
        <span aria-hidden="true"></span>
        <button id="undo" type="button" disabled title="撤销上一次操作（Ctrl+Z / ⌘Z）">撤销</button>
        <button id="redo" type="button" disabled title="重做（Ctrl+Shift+Z / Ctrl+Y）">重做</button>
        <span aria-hidden="true"></span>
        <button id="reset" type="button" disabled title="恢复初始作品，清除形态和涂色，仍可撤销">重置</button>
        <label id="width-control" hidden>粗细 <input id="limb-width" type="range" min="5" max="42" step="1" value="17" aria-label="肢体粗细" /></label>
        <button id="delete-limb" type="button" hidden>删除肢体</button>
        <button id="save-art" type="button" title="下载可继续编辑的 JSON 作品文件">保存作品</button>
        <button id="open-art" type="button" title="从 JSON 文件恢复完整作品">打开作品</button>
      </div>
      <aside id="paint-panel" class="paint-panel" aria-label="自由涂色工具" hidden>
        <h1>给它一点颜色</h1>
        <p>笔迹随身体和分枝一起动</p>
        <div class="paint-tool-row">
          <button id="brush-tool" type="button" aria-pressed="true">画笔</button>
          <button id="eraser-tool" type="button" aria-pressed="false">橡皮擦</button>
        </div>
        <label class="paint-label">自由选色 <input id="paint-color" type="color" value="#ff6695" aria-label="画笔颜色" /></label>
        <div id="color-swatches" aria-label="预设色卡"></div>
        <label class="paint-label">笔刷大小 <output id="brush-size-value">18</output><input id="brush-size" type="range" min="2" max="70" value="18" aria-label="画笔粗细" /></label>
        <label class="paint-label" for="paint-target">绘画部位</label>
        <select id="paint-target" aria-label="绘画部位"><option value="auto">自动识别部位</option><option value="body">身体</option></select>
        <div class="fill-actions">
          <button id="fill-body" type="button">身体底色</button>
          <button id="fill-limb" type="button" disabled>所选肢体底色</button>
          <button id="fill-all" type="button">全身底色</button>
        </div>
        <p>底色独立于笔迹。橡皮擦只擦涂鸦，擦过的位置还能重新画。</p>
      </aside>
      <input id="art-file" type="file" accept=".json,application/json" hidden aria-label="打开作品文件" />
      <p id="art-status" role="status" aria-live="polite"></p>
      <p id="interaction-hint" aria-live="polite">拖动身体揉捏 · 切换「长出肢体」可从边缘拉出新肢体</p>
    </main>
  </body>
</html>
